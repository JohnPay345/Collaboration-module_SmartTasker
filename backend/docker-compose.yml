version: "3.9"
services:
  web-api:
    build:
      context: .  # Директория, содержащая Dockerfile
      dockerfile: Dockerfile-Node
    container_name: "web-api"
    ports:
      - '8080:8080'
    depends_on:
      - postgres-db
      - rabbitmq
      - redis
    volumes:
      - app_data:/web-api
    networks:
      - my_network
    
  postgres-db:
    build:
      context: .  # Директория, содержащая Dockerfile
      dockerfile: Dockerfile-PG
    container_name: "postgres"
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ST_c&Rsov@aya789
      POSTGRES_PASSWORD: A@RlZlMr*tNtgvrmri
      POSTGRES_DB: root_db
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - my_network

  redis:
    image: redis:8.6.2
    container_name: "redis"
    hostname: redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass root_p@ss007d
    volumes:
      - rs_data:/rs_data
    networks:
      - my_network
  
  rabbitmq:
    image: rabbitmq:4.1.0-management
    container_name: "rabbitmq"
    hostname: rabbitmq
    ports:
      - '15672:15672'
      - '5672:5672'
    environment:
      RABBITMQ_DEFAULT_USER: rmuser
      RABBITMQ_DEFAULT_PASS: rmpassword
    volumes:
      - rm_data:/var/lib/rabbitmq
    networks:
      - my_network

  nginx:
    build:
      context: .
      dockerfile: ./Dockerfile-Nginx
    container_name: "nginx_proxy"
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web-api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/ssl
    networks:
      - my_network

#  certbot:
#    image: certbot/certbot
#    container_name: my_certbot
#    volumes:
#      - ./nginx/certs:/etc/letsencrypt
#      - /var/log/letsencrypt:/var/log/letsencrypt
#      - /etc/letsencrypt/renewal:/etc/letsencrypt/renewal
#    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --nginx; sleep 12h & wait $${!}; done;'"
#    depends_on:
#      - nginx

volumes:
  db_data:
  app_data:
  rm_data:
  rs_data:

networks:
  my_network:
