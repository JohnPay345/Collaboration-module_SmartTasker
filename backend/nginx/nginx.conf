user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3; # Поддержка современных протоколов
    ssl_prefer_server_ciphers on;
    ssl_dhparam /etc/nginx/ssl/dhparam.pem; # Динамические параметры Diffie-Hellman

    # HTTP/2 Settings
    # http2_header_reuse on;
    http2_push_preload on;

    # Добавляем лог-формат для более детальной информации
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time cdn_cache=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    gzip on;
    gzip_disable "msie6";

    # Конфигурация для вашего приложения
    server {
        listen 80;
        server_name your_domain.com www.your_domain.com; # Замените на ваш домен

        # Перенаправляем HTTP на HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2; # Включаем SSL и HTTP/2
        server_name your_domain.com www.your_domain.com; # Замените на ваш домен

        ssl_certificate /etc/nginx/ssl/dev.crt; # Путь внутри контейнера Nginx
        ssl_certificate_key /etc/nginx/ssl/dev.key; # Путь внутри контейнера Nginx
        ssl_dhparam /etc/nginx/ssl/dhparam.pem; # Путь к DH params

        # Опции безопасности SSL
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off; # Отключаем session tickets для лучшей безопасности

        # Настройки для CORS, если ваш бэкенд обрабатывает API запросы
        location /api {
            proxy_pass http://web-api:8080; # Проксируем запросы на бэкенд
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Для HTTP/2
            proxy_http_version 1.1; # Nginx использует HTTP/1.1 для проксирования, но клиент может использовать HTTP/2
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Обработка ошибок
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
